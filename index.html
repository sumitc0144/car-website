    <style>
	
/*--removes default inner and outer spacing for all elements and make calculation for width,height  ,padding bordeer --*/
        
        *{
            margin: 0;/*inner*/
            padding: 0;/*outer*/
            box-sizing: border-box;/*calculation*/
        }
			/*--sets background colorl to light gray and add horizontal and vertical grid lines --*/
        body{
            background-color: #D2D2D2;
            background-image:
            repeating-linear-gradient( to right,
				transparent 0 100px,/* transparent from 0px → 100px */
                #25283b22 100px 101px /* faint line at 100–101px */
            ),/*--horizontal--*/
            repeating-linear-gradient(
                to bottom,
		 transparent 0 100px,/* transparent from 0px → 100px */
                #25283b22 100px 101px/* faint line at 100–101px */
            );/*vertical set its darkness--*/
        }
/* Dropdown container */
	.dropdown {
 	 position: relative;
	/*--child elements (like the dropdown menu) that use position: 	absolute; will be positioned relative to this .dropdown--*/
  	display: inline-block;
	/*--The element behaves like an inline element (sits in a line 	with text/other elements).--*/
}

/* Dropdown menu (hidden by default) */
.dropdown-content {
  	display: none;
	/*--Hides the dropdown menu by default.
          It only becomes visible when you trigger it e.g., :hover--*/
 	 position: absolute;
	/*--This ensures the menu appears right under or near the 	dropdown button, not randomly on the page.--*/
 	 background-color: #333;/*--dark gray --*/
  	min-width: 200px;/*--menu width --*/
  	border-radius: 6px;
	/*--Rounds the corners of the menu with a radius of 6 	pixels, 	giving it a smooth look instead of sharp edges.	*--/
 	 box-shadow: 0px 8px 16px rgba(0,0,0,0.3);				/* horizintal shift, 	pushed down, blurred,black shadow with 	transparency--*/
 	 z-index: 1000;
	/*--Ensures the menu appears on top of other elements on the 	page.--*/
}

/* Dropdown links to <a> */
.dropdown-content a {
  	color: white;/*--Makes the text of the links white.--*/
 	 padding: 10px 14px;
	/*--Adds space inside each link (between text and edges).
	10px = top and bottom spacing.14px = left and right spacing.--*/
 	 text-decoration: none;
	/*--Removes the default underline that browsers put on 	links.--*/
 	 display: block;
	/*--Makes each link act like a block element and heightlight the 	block--*/
  	font-size: 16px;
}


/* Show menu when hovering over parent */
/*--Targets the .dropdown container when the user hovers--*/
/*--This is the hidden menu inside the dropdown.--*/
.dropdown:hover .dropdown-content {
         display: block;
	/*--Changes the .dropdown-content from none → block, making it 	visible.--*/
}

.navbar {
  display: flex;
  /*--turns an element into a flex container,Flexbox is used to easily             rrange and align items in rows or columns--*/
  justify-content: center;
  /*--Aligns all child elements horizontally in the center of the   	navbar.--*/
  align-items: center;/*--vertical,center--*/
  background-color: #333;/*-- dark gray color--*/
  padding: 10px 20px;
  position: relative;
}


.nav-left a,
.nav-right a {
  	color: white;
	font-size: 20px;
	text-decoration: none;
        margin: 0 20px;
	/*--Adds horizontal spacing between links:
	0 = no vertical margin (top/bottom).
	10px = spacing on left and right.--*/
}

.nav-center a,
.nav-right a {
	color: white;
        padding: 4px 10px;
        background-color: #555;
        position: absolute;
        right: 10px;/*--Pushes the link 20px away from the right edge of      	its 	positioned parent (navbar).--*/
  	border-radius: 50px; /* This creates the ellipse shape */
   	 font-size: 16px;
}
    .navbar a:hover {
      background-color: #575757;/*--dark gray--*/
	transform: scale(1.2);/*--makes the link grow by 20% bigger when 	hovered--*/
        background: linear-gradient(red,  orange, orange,white);
	/*--Creates a gradient background--*/
  -webkit-background-clip: text;
/*--Makes the background only apply inside the text--*/
  -webkit-text-fill-color: transparent;
/*--Makes the text’s normal color transparent so the gradient background is visible inside the text.
Without this, the text would still show as white.--*/

    }

        /*--Creates a pseudo-element before the <body>’s content
	Acts like a “ghost element” you can style, useful for 	decorations (like shadows, overlays,etc)--*/
        body::before{
            position: absolute;
            width: min(1400px, 90vw);
            top: 10%;
            left: 50%;
            height: 90%;
            transform: translateX(-50%);
            content: '';
            background-image: url(images/bg.png);
            background-size: 100%;
            background-repeat: no-repeat;
            background-position: top center;
            pointer-events: none;
        }
